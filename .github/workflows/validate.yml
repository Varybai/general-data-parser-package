name: Validate package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate skill and acceptance verifier
        run: npm test
      - name: Convert three local samples
        run: python3 -B scripts/smoke_formats.py --output "$RUNNER_TEMP/general-parser-smoke"
      - name: Parse and replay engineering formats
        run: python3 -B scripts/smoke_engineering.py --output "$RUNNER_TEMP/general-parser-engineering"
      - name: Check npm package contents
        run: |
          npm pack --dry-run --ignore-scripts --json > "$RUNNER_TEMP/general-parser-pack.json"
          python3 -B scripts/check_npm_payload.py "$RUNNER_TEMP/general-parser-pack.json"
